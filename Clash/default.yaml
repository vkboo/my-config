# ClashMac 精简配置
# 使用前：把下面 proxy-providers.Subscription.url 换成你的订阅地址（建议带 &flag=clash）
# 在 ClashMac 中作为本地配置导入，或替换原来的 Cache Config
# 默认：国内直连，AI 走台湾，Telegram 走新加坡，其余走「节点选择」
# 策略组可在客户端里随时改节点，不必改文件

mode: rule
mixed-port: 7890
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/16
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "+.local"
    - "geosite:private"
    - "geosite:cn"

proxy-providers:
  Primary:
    type: http
    url: "{{PRIMARY_SUB_SUB_URL}}"
    interval: 86400
    health-check:
      enable: true
      url: 'https://www.google.com/generate_204'
      interval: 300
  Backup:
    type: http
    url: "{{BACKUP_SUB_SUB_URL}}"
    interval: 86400
    health-check:
      enable: true
      url: 'https://www.google.com/generate_204'
      interval: 300
proxy-groups:
  - name: 节点选择
    type: select
    proxies: [自动选择, 香港, 台湾, 新加坡, 日本, 美国, DIRECT]

  - name: 自动选择
    type: url-test
    use: [Primary, Backup]
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50

  - name: 香港
    type: url-test
    use: [Primary, Backup]
    filter: "(?i)(香港|HK|Hong\\s?Kong|HKG)"
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50

  - name: 台湾
    type: url-test
    use: [Primary, Backup]
    filter: "(?i)(台湾|台灣|TW|Taiwan)"
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50

  - name: 新加坡
    type: url-test
    use: [Primary, Backup]
    filter: "(?i)(新加坡|SG|Singapore)"
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50

  - name: 日本
    type: url-test
    use: [Primary, Backup]
    filter: "(?i)(日本|JP|Japan)"
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50

  - name: 美国
    type: url-test
    use: [Primary, Backup]
    filter: "(?i)(美国|美國|US|USA|United\\s?States)"
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50

  - name: AI
    type: select
    proxies: [台湾, 新加坡, 美国, 自动选择, 节点选择]

  - name: Telegram
    type: select
    proxies: [新加坡, 香港, 自动选择, 节点选择]

rules:
  - GEOSITE,private,DIRECT
  - GEOSITE,apple@cn,DIRECT
  - GEOSITE,category-ai-!cn,AI
  - DOMAIN-SUFFIX,notebooklm.google,AI
  - DOMAIN-SUFFIX,notebooklm.google.com,AI
  - DOMAIN,stitch.withgoogle.com,AI
  - DOMAIN-SUFFIX,diabrowser.com,AI
  - DOMAIN-SUFFIX,diabrowser.engineering,AI
  - PROCESS-NAME,Dia,AI
  - GEOSITE,telegram,Telegram
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT,no-resolve
  - MATCH,节点选择
