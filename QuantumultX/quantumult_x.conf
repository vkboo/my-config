# 基于 Quantumult X 官方 sample，按与 ClashMac 精简配置相近的策略重构
# 官方参考: https://github.com/crossutility/Quantumult-X/blob/master/sample.conf
# 原模板来源: https://github.com/sve1r/Rules-For-Quantumult-X
#
# 以 ';' 或 '#' 或 '//' 开头的配置文件行为注释行
#
# 最后更新时间: 2026年11月12日
#
# ================

# 基础部分
[general]
// > 配置文件图标
profile_img_url = https://img.sveir.xyz/static/favicon%40trs.png
// > 网络测试链接
network_check_url = http://www.bing.com
// > 服务器测试链接
server_check_url = http://www.gstatic.com/generate_204
// > 服务器测试超时时间 (毫秒)
server_check_timeout = 3000
// > 节点 GEO 位置信息检测
// 如果不需识别节点地区为中文和显示国旗，请将下面行 geo_location_checker 进行注释ß
geo_location_checker = http://ip-api.com/json/?lang=zh-CN,https://cdn.jsdelivr.net/gh/KOP-XIAO/QuantumultX@master/Scripts/IP_API.js
// > 指定 WiFi SSID 下的运行模式
// 如果需要指定 对应 SSID 的运行模式,请取消下列注释并自定配置
;running_mode_trigger = filter, filter, asus-5g:all_direct, asus:all_proxy
// > 资源解析器
resource_parser_url = https://cdn.jsdelivr.net/gh/KOP-XIAO/QuantumultX@master/Scripts/resource-parser.js
// > DNS 排除列表
// 不使用 fakeip 映射，可一定程度防止检测到使用代理
dns_exclusion_list = *.lan, *.local, cable.auth.com, *.msftconnecttest.com, *.msftncsi.com, network-test.debian.org, detectportal.firefox.com, resolver1.opendns.com, *.srv.nintendo.net, *.stun.playstation.net, xbox.*.microsoft.com, *.xboxlive.com, stun.*, *.qq.com, localhost.*.qq.com, *.logon.battlenet.com.cn, *.logon.battle.net, *.blzstatic.cn, *.cmpassport.com, id6.me, open.e.189.cn, mdn.open.wo.cn, auth.wosms.cn, *.jegotrip.com.cn, *.icitymobile.mobi, *.pingan.com.cn, *.cmbchina.com, *?miwifi.com, pool.ntp.org, *.pool.ntp.org, ntp.*.com, time.*.com, ntp?.*.com, time?.*.com, time.*.gov, time.*.edu.cn, *.ntp.org.cn, time.*.apple.com, PDC._msDCS.*.*, DC._msDCS.*.*, GC._msDCS.*.*
// > 排除路由
// 以下 ip-cidr 中的路由将不经由 QuantumultX 进行处理
excluded_routes = 192.168.0.0/16, 172.16.0.0/12, 100.64.0.0/10, 10.0.0.0/8, 239.255.255.250/32

# 域名解析部分
[dns]
server = 223.5.5.5
server = 119.29.29.29

# 分流策略组
# 手动组（static，第一项为默认）：节点选择、AI、Telegram
# 自动组（url-latency-benchmark）：自动选择 + 五个地区组
# check-interval 单位秒，tolerance 单位毫秒，均为官方 sample 支持的参数
# 官方说明：策略被请求激活后才会按间隔复测；alive-checking=true 时即使空闲也会复测
[policy]
# 手动选择出口，默认使用「自动选择」
static = 节点选择, 自动选择, 香港, 台湾, 新加坡, 日本, 美国, direct, img-url=https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Airport.png
# 汇总 Primary、Backup 两个订阅中的节点，按延迟优选
url-latency-benchmark = 自动选择, resource-tag-regex=Primary|Backup, server-tag-regex=.*, check-interval=300, alive-checking=false, tolerance=50, img-url=https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Global.png
# 以下地区组只在对应命名的节点里测速，参数与「自动选择」相同
url-latency-benchmark = 香港, resource-tag-regex=Primary|Backup, server-tag-regex=(?i)(香港|HK|Hong\s?Kong|HKG), check-interval=300, alive-checking=false, tolerance=50, img-url=https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Hong_Kong.png
url-latency-benchmark = 台湾, resource-tag-regex=Primary|Backup, server-tag-regex=(?i)(台湾|台灣|TW|Taiwan|台北), check-interval=300, alive-checking=false, tolerance=50, img-url=https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Taiwan.png
url-latency-benchmark = 新加坡, resource-tag-regex=Primary|Backup, server-tag-regex=(?i)(新加坡|SG|Singapore), check-interval=300, alive-checking=false, tolerance=50, img-url=https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Singapore.png
url-latency-benchmark = 日本, resource-tag-regex=Primary|Backup, server-tag-regex=(?i)(日本|JP|Japan), check-interval=300, alive-checking=false, tolerance=50, img-url=https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Japan.png
url-latency-benchmark = 美国, resource-tag-regex=Primary|Backup, server-tag-regex=(?i)(美国|美國|US|USA|United\s?States), check-interval=300, alive-checking=false, tolerance=50, img-url=https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/United_States.png
# 默认台湾，可手动改为新加坡、美国、自动选择或节点选择
static = AI, 台湾, 新加坡, 美国, 自动选择, 节点选择, img-url=https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Bot.png
# 默认新加坡，可手动改为香港、自动选择或节点选择
static = Telegram, 新加坡, 香港, 自动选择, 节点选择, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/Telegram.png

[server_local]

[server_remote]
{{PRIMARY_SUB_SUB_URL}}, tag=Primary, update-interval=172800, opt-parser=true, enabled=true
{{BACKUP_SUB_URL}}, tag=Backup, update-interval=172800, opt-parser=true, enabled=true

[filter_local]
# AI 域名放在本地，确保优先于远程 Google 列表；Google 一般流量仍走「节点选择」
# Quantumult X 官方规则类型无 PROCESS-NAME，无法按进程名匹配 Dia，只能按域名分流
host-suffix, diabrowser.com, AI
host-suffix, diabrowser.engineering, AI
host, stitch.withgoogle.com, AI
host-suffix, notebooklm.google, AI
host-suffix, notebooklm.google.com, AI
host, notebooklm.googleapis.com, AI
host, notebooklm-pa.googleapis.com, AI
host-suffix, gemini.google.com, AI
host-suffix, bard.google.com, AI
host, aistudio.google.com, AI
host, makersuite.google.com, AI
host, alkalimakersuite-pa.clients6.google.com, AI
host-suffix, generativeai.google, AI
host, ai.google.dev, AI
host-suffix, generativelanguage.googleapis.com, AI
host-suffix, deepmind.google, AI
host-suffix, deepmind.com, AI
# 局域网直连
ip-cidr, 10.0.0.0/8, direct
ip-cidr, 127.0.0.0/8, direct
ip-cidr, 172.16.0.0/12, direct
ip-cidr, 192.168.0.0/16, direct
ip-cidr, 224.0.0.0/24, direct
geoip, cn, direct
# 其余流量走手动「节点选择」
final, 节点选择

[filter_remote]
# 默认匹配顺序：本地规则（除 final）> 远程规则（按下列顺序）> final
# 未开启 inserted-resource，以便本地 AI 域名优先于远程 Google 列表
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Lan/Lan.list, tag=Lan, force-policy=direct, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Direct/Direct.list, tag=Direct, force-policy=direct, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/iCloud/iCloud.list, tag=iCloud, force-policy=direct, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/AppStore/AppStore.list, tag=AppStore, force-policy=direct, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/AppleProxy/AppleProxy.list, tag=AppleProxy, force-policy=节点选择, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/OpenAI/OpenAI.list, tag=OpenAI, force-policy=AI, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Anthropic/Anthropic.list, tag=Anthropic, force-policy=AI, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Telegram/Telegram.list, tag=Telegram, force-policy=Telegram, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Google/Google.list, tag=Google, force-policy=节点选择, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Proxy/Proxy.list, tag=Proxy, force-policy=节点选择, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/ChinaMax/ChinaMax.list, tag=ChinaMax, force-policy=direct, enabled=true

[rewrite_local]

[rewrite_remote]
# 网页去广告
https://rules-for-qx.sveir.xyz/Rewrite/AdBlock/WebAdBlock.adblock, tag=常用网页去广告, update-interval=172800, opt-parser=false, enabled=false

# 知乎去广告
https://rules-for-qx.sveir.xyz/Rewrite/AdBlock/Zhihu.adblock, tag=知乎去广告, update-interval=172800, opt-parser=false, enabled=false

# 微博去广告
https://rules-for-qx.sveir.xyz/Rewrite/AdBlock/Weibo.adblock, tag=微博去广告, update-interval=172800, opt-parser=false, enabled=false

# Youtube 去广告
https://rules-for-qx.sveir.xyz/Rewrite/AdBlock/Youtube.adblock, tag=Youtube 去广告, update-interval=172800, opt-parser=false, enabled=false

# TestFlight复写
https://rules-for-qx.sveir.xyz/Rewrite/Services/Apple/TestFlight/TestFlightDownload.conf, tag=TestFlight, update-interval=172800, opt-parser=false, enabled=false

# Rewrite 复写远程订阅
https://rules-for-qx.sveir.xyz/Rewrite/Rewrite.conf, tag=Rewrite, update-interval=172800, opt-parser=false, enabled=false

[task_local]
# 流媒体查询脚本
event-interaction https://cdn.jsdelivr.net/gh/KOP-XIAO/QuantumultX@master/Scripts/streaming-ui-check.js, tag = 流媒体 - 解锁查询, img-url=checkmark.seal.system, enabled=true

[http_backend]

[mitm]
